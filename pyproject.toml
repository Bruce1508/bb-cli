[project]
name = "bb-cli"
version = "0.1.0"
description = "Terminal CLI for Blackboard LMS — sync deadlines, grades, and announcements"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "playwright>=1.40",
    "icalendar>=5.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "tomli-w>=1.0",
]

[project.scripts]
bb = "bb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bb"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-watch>=4.2",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
