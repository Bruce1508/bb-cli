[project]
name = "blackboard-cli"
version = "0.1.5"
description = "Terminal CLI for Blackboard LMS — sync deadlines, grades, and announcements"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "playwright>=1.40",
    "icalendar>=5.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "tomli-w>=1.0",
    "pdfplumber>=0.11",
    "ollama>=0.3",
    "mcp>=1.12,<2.0",
]

[project.scripts]
bb = "bb.cli:app"

[project.urls]
Homepage = "https://github.com/Bruce1508/bb-cli"
Repository = "https://github.com/Bruce1508/bb-cli"
Issues = "https://github.com/Bruce1508/bb-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bb"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-watch>=4.2",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
